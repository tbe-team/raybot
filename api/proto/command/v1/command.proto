syntax = "proto3";

package command.v1;

option go_package = "github.com/tbe-team/raybot/proto/command/v1;commandv1";

service CommandService {
  rpc MoveToLocation(MoveToLocationRequest) returns (MoveToLocationResponse) {}
  rpc LiftBox(LiftBoxRequest) returns (LiftBoxResponse) {}
  rpc DropBox(DropBoxRequest) returns (DropBoxResponse) {}
}

message MoveToLocationRequest {
  string location = 1;
}

message MoveToLocationResponse {
  string command_id = 1;
}

message LiftBoxRequest {}

message LiftBoxResponse {
  string command_id = 1;
}

message DropBoxRequest {}

message DropBoxResponse {
  string command_id = 1;
}
